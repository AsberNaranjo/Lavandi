<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Figtree:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; background: #F7F4EF; font-family: Figtree, system-ui, 'Segoe UI', sans-serif; color: #17394B; }
    a { color: #2E86AB; } a:hover { color: #17394B; }
    .rotulo { font-size: 11px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: #17394B; margin: 0; }
    .marca { font-family: Quicksand, system-ui, 'Segoe UI', sans-serif; font-weight: 700; color: #2E86AB; letter-spacing: -.015em; line-height: 1; margin: 0; }
    .bajada { font-weight: 500; letter-spacing: .17em; text-transform: uppercase; color: #17394B; margin: 0; }
  </style>
</helmet>
<div style="padding: 56px; display: flex; flex-direction: column; gap: 38px;">

  <div style="display: flex; align-items: center; gap: 30px;">
    <svg viewBox="0 0 96 96" width="140" height="140" role="img" aria-label="Símbolo Lavandi">
      <path d="M17 18L17 66A12 12 0 0 0 29 78L65 78" fill="none" stroke="#2E86AB" stroke-width="13" stroke-linecap="round"></path>
      <rect x="27" y="24" width="44" height="44" rx="13" fill="#2E86AB"></rect>
      <circle cx="49" cy="46" r="14" fill="#F7F4EF"></circle>
      <circle cx="49" cy="46" r="7.5" fill="#A8D5E2"></circle>
      <circle cx="80" cy="78" r="5" fill="#E8C547"></circle>
    </svg>
    <div style="display: flex; flex-direction: column; gap: 14px;">
      <p class="marca" style="font-size: 86px;">Lavandi</p>
      <p class="bajada" style="font-size: 13px;">De tu cel a tu closet</p>
    </div>
  </div>

  <div style="height: 1px; background: #A8D5E2;"></div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px;">

    <div style="display: flex; flex-direction: column; gap: 18px; align-items: flex-start;">
      <p class="rotulo">Lockup vertical</p>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 8px 0;">
        <svg viewBox="0 0 96 96" width="78" height="78" role="img" aria-label="Símbolo Lavandi">
          <path d="M17 18L17 66A12 12 0 0 0 29 78L65 78" fill="none" stroke="#2E86AB" stroke-width="13" stroke-linecap="round"></path>
          <rect x="27" y="24" width="44" height="44" rx="13" fill="#2E86AB"></rect>
          <circle cx="49" cy="46" r="14" fill="#F7F4EF"></circle>
          <circle cx="49" cy="46" r="7.5" fill="#A8D5E2"></circle>
          <circle cx="80" cy="78" r="5" fill="#E8C547"></circle>
        </svg>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
          <p class="marca" style="font-size: 40px;">Lavandi</p>
          <p class="bajada" style="font-size: 9px;">De tu cel a tu closet</p>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 18px; align-items: flex-start;">
      <p class="rotulo">Símbolo solo</p>
      <div style="padding: 8px 0;">
        <svg viewBox="0 0 96 96" width="112" height="112" role="img" aria-label="Símbolo Lavandi">
          <path d="M17 18L17 66A12 12 0 0 0 29 78L65 78" fill="none" stroke="#2E86AB" stroke-width="13" stroke-linecap="round"></path>
          <rect x="27" y="24" width="44" height="44" rx="13" fill="#2E86AB"></rect>
          <circle cx="49" cy="46" r="14" fill="#F7F4EF"></circle>
          <circle cx="49" cy="46" r="7.5" fill="#A8D5E2"></circle>
          <circle cx="80" cy="78" r="5" fill="#E8C547"></circle>
        </svg>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 18px; align-items: flex-start;">
      <p class="rotulo">Logotipo solo</p>
      <div style="padding: 8px 0; display: flex; align-items: center; min-height: 112px;">
        <p class="marca" style="font-size: 46px;">Lavandi</p>
      </div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
