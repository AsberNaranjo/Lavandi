  <title>Lavandi — logotipo de la palabra</title>
  <desc>La L es la carretera del símbolo; el círculo de la d es la lavadora; el punto de la i es el pin. Letras en Berlin Sans FB Regular, convertidas a curvas: no hace falta la fuente para usarlo. Extraído sin redibujar del archivo del diseñador de EL CLIENTE (tipografia.ai, recibido el 2026-09-30) y verificado por diferencia de píxeles. Colores llevados a la paleta oficial de tokens.json.</desc>

  <!-- Paleta oficial. El diseñador usó #2686AD, #2686AE y #2786AC para el azul y #E8C546 para el Limón:
