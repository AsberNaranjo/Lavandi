<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Source Sans 3', system-ui, sans-serif; }
    a { color: #297899; } a:hover { color: #1F5A73; }
  </style>
</helmet>
<div style="background: {{c.fondo}}; color: {{c.texto}}; padding: 32px; box-sizing: border-box; min-height: 100%; display: flex; flex-direction: column; gap: 20px">

  <div style="display: flex; flex-direction: column; gap: 4px">
    <div style="font-family: 'Nunito', system-ui, sans-serif; font-size: 24px; font-weight: 700; line-height: 1.2">Tarjeta de lavandería</div>
    <div style="font-size: 14px; color: {{c.textoSuave}}; line-height: 1.5">El usuario elige aquí. La disponibilidad se comunica con color <strong style="color: {{c.texto}}">y</strong> con texto: nunca solo con color.</div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px">
    <sc-for list="{{tarjetas}}" as="t" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: {{c.textoSuave}}">{{t.rotulo}}</div>
        <div style="background: {{c.superficie}}; border: 1px solid {{c.borde}}; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px">

          <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
            <div style="font-family: 'Nunito', system-ui, sans-serif; font-size: 18px; font-weight: 700; line-height: 1.25">{{t.nombre}}</div>
            <div style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; border: 1px solid {{t.color}}; color: {{t.color}}; flex: none">
              <div style="width: 8px; height: 8px; border-radius: 999px; background: {{t.color}}; flex: none"></div>
              {{t.estado}}
            </div>
          </div>

          <div style="font-size: 14px; color: {{c.textoSuave}}">{{t.meta}}</div>

          <div style="display: flex; gap: 8px; flex-wrap: wrap">
            <sc-for list="{{t.servicios}}" as="s" hint-placeholder-count="3">
              <div style="font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 999px; border: 1px solid {{c.borde}}; color: {{c.textoSuave}}">{{s}}</div>
            </sc-for>
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 2px">
            <div style="font-size: 14px; color: {{c.textoSuave}}">{{t.precio}}</div>
            <div style="min-height: 48px; padding: 0 20px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; background: {{t.btnFondo}}; color: {{t.btnTexto}}; border: 1px solid {{t.btnBorde}}; flex: none">{{t.btn}}</div>
          </div>

        </div>
      </div>
    </sc-for>
  </div>

  <div style="font-size: 13px; color: {{c.textoSuave}}; line-height: 1.5">El precio real depende del método de fijación, que sigue abierto. Aquí va como marcador.</div>
</div>
</x-dc>
<script data-dc-script data-props='{"modo":{"editor":"enum","options":["claro","oscuro"],"default":"claro","section":"Modo"}}'>
class Component extends DCLogic {
  paleta(m) {
    var P = {
      claro:  { fondo:'#F7F4EF', superficie:'#FFFFFF', hundida:'#EDE9E2', texto:'#171C21',
                textoSuave:'#515A64', desactivado:'#6B7681', borde:'#DCE0E5', bordeFuerte:'#6B7681',
                accion:'#297899', accionTexto:'#FFFFFF',
                exito:'#1E6F45', atencion:'#8A5A00', error:'#A32222' },
      oscuro: { fondo:'#0E1216', superficie:'#171C21', hundida:'#0E1216', texto:'#F7F8F9',
                textoSuave:'#C0C6CE', desactivado:'#98A1AC', borde:'#3B424A', bordeFuerte:'#98A1AC',
                accion:'#308CB3', accionTexto:'#0E1216',
                exito:'#5FD39B', atencion:'#F0B84D', error:'#FF8A80' }
    };
    return P[m] || P.claro;
  }
  renderVals() {
    var c = this.paleta(this.props.modo ?? 'claro');
    return {
      c: c,
      tarjetas: [
        { rotulo: 'Abierta', nombre: 'Lavandería A', estado: 'Abierta', color: c.exito,
          meta: 'A 1.2 km · Calificación 4.8', servicios: ['Estándar', 'Planchado', 'En seco'],
          precio: 'Desde $000 por kilo', btn: 'Elegir',
          btnFondo: c.accion, btnTexto: c.accionTexto, btnBorde: c.accion },
        { rotulo: 'Sin cupo', nombre: 'Lavandería B', estado: 'Sin cupo hoy', color: c.atencion,
          meta: 'A 2.6 km · Calificación 4.5', servicios: ['Estándar', 'Planchado'],
          precio: 'Desde $000 por kilo', btn: 'Ver horarios',
          btnFondo: c.superficie, btnTexto: c.texto, btnBorde: c.bordeFuerte },
        { rotulo: 'Cerrada', nombre: 'Lavandería C', estado: 'Cerrada', color: c.error,
          meta: 'A 3.4 km · Calificación 4.2', servicios: ['Estándar'],
          precio: 'Abre mañana a las 9:00', btn: 'Elegir',
          btnFondo: c.hundida, btnTexto: c.desactivado, btnBorde: c.borde }
      ]
    };
  }
}
</script>
</body>
</html>
